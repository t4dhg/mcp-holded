# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - holdedApiKey
    properties:
      holdedApiKey:
        type: string
        description: Holded v2 Personal Access Token (pat_<id>_<secret>), from Settings, Developers, API
      holdedBaseUrl:
        type: string
        description: Override the API base URL
        default: 'https://api.holded.com/api/v2'
      holdedTimeoutMs:
        type: number
        description: Per-request timeout in milliseconds
        default: 30000
      holdedMaxRetries:
        type: number
        description: Retry attempts for GET requests; writes are never retried
        default: 3
      debug:
        type: boolean
        description: Log requests to stderr
        default: false
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@t4dhg/mcp-holded'],
      env: {
        HOLDED_API_KEY: config.holdedApiKey,
        ...(config.holdedBaseUrl && { HOLDED_BASE_URL: config.holdedBaseUrl }),
        ...(config.holdedTimeoutMs !== undefined && {
          HOLDED_TIMEOUT_MS: String(config.holdedTimeoutMs),
        }),
        ...(config.holdedMaxRetries !== undefined && {
          HOLDED_MAX_RETRIES: String(config.holdedMaxRetries),
        }),
        ...(config.debug && { DEBUG: 'true' })
      }
    })
