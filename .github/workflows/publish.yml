name: Stage npm release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require matching release tag
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF!=="refs/tags/v"+p.version) throw Error("Run on the matching version tag");'
      - run: npm ci
      - run: npm run audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:package-checker
      - run: npm run test:coverage
      - run: npm run build
      - name: Inspect the actual release artifact
        run: npm run check:package -- "$RUNNER_TEMP/package"
      - name: Install inspected release candidate
        run: npm install --prefix "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/package/"*.tgz --engine-strict --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Audit fresh runtime dependencies
        run: npm audit --prefix "$RUNNER_TEMP/consumer" --omit=dev --audit-level=low
      - name: Verify installed executable
        run: node scripts/stdio-smoke.mjs "$RUNNER_TEMP/consumer/node_modules/.bin/mcp-holded"
      - name: Record and stage the inspected tarball
        shell: bash
        run: |
          set -o pipefail
          node -e 'const p=require(process.env.RUNNER_TEMP+"/package/pack-manifest.json"); require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["Commit: "+process.env.GITHUB_SHA,"Package: "+p.name+"@"+p.version,"SHA1: "+p.shasum,"Integrity: "+p.integrity].join("\n\n")+"\n");'
          npm stage publish "$RUNNER_TEMP/package/"*.tgz --access public --json | tee "$RUNNER_TEMP/package/stage-result.json"
      - name: Retain release candidate and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-candidate
          path: ${{ runner.temp }}/package/
          if-no-files-found: ignore
