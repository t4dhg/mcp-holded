name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:package-checker
      - run: npm run build
      - run: npm run check:package -- "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/junit.xml
          report_type: test_results
          fail_ci_if_error: false
  packed-runtime:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Install inspected package with strict engines
        run: npm install --prefix "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/package/"*.tgz --engine-strict --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Audit fresh runtime dependencies
        run: npm audit --prefix "$RUNNER_TEMP/consumer" --omit=dev --audit-level=low
      - name: Verify installed executable
        run: node scripts/stdio-smoke.mjs "$RUNNER_TEMP/consumer/node_modules/.bin/mcp-holded"
