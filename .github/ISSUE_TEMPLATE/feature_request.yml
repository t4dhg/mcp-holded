name: Feature request
description: An endpoint, action, resource or prompt that is missing
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Never paste your API key, a `pat_` token, or an unredacted response containing customer data. This project builds schemas from real responses, so a sample is genuinely useful, but redact ids, tax ids, names, addresses, bank details and amounts before posting. A token pasted into a public issue is the most likely way a credential leaks from this project.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the implementation. It may already be possible with `holded_request`.
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Holded v2 endpoint, if you know it
      placeholder: GET /api/v2/...
  - type: textarea
    id: response
    attributes:
      label: A real response from that endpoint, anonymised
      description: This server builds schemas from real responses, so a sample makes the change much faster. Redact it before pasting.
      render: json
